name: Release-plz

permissions:
  pull-requests: write
  contents: write

on:
  push:
    branches: [main]

jobs:
  # Opens/updates the release PR (version bump + changelog) from conventional commits.
  release-plz-pr:
    name: Release PR
    runs-on: ubuntu-latest
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      # release-plz runs `cargo package`, which builds the crate (libudev-sys needs libudev.pc).
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev
      - name: Run release-plz release-pr
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Tags and creates the GitHub release for merged release PRs (or the first, untagged version),
  # then builds the Linux binary and attaches it to that release (macOS: see below).
  release-plz-release:
    name: Release
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release-plz.outputs.releases_created }}
      releases: ${{ steps.release-plz.outputs.releases }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      # release-plz runs `cargo package`, which builds the crate (libudev-sys needs libudev.pc).
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev
      - name: Run release-plz release
        id: release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and attach Linux binary
        if: ${{ steps.release-plz.outputs.releases_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: |
          set -euo pipefail
          cargo build --release --locked
          TAG=$(echo "$RELEASES" | jq -r '.[0].tag')
          VERSION=${TAG#v}
          STAGE="ddpm-${VERSION}-x86_64-unknown-linux-gnu"
          mkdir "$STAGE"
          cp target/release/ddpm assets/ddpm.desktop README.md "$STAGE"/
          tar czf "$STAGE.tar.gz" "$STAGE"
          sha256sum "$STAGE.tar.gz" > "$STAGE.tar.gz.sha256"
          gh release upload "$TAG" "$STAGE.tar.gz" "$STAGE.tar.gz.sha256"

  # Universal (Apple Silicon + Intel) DDPM.app, ad-hoc signed, zipped onto the same release.
  macos-app:
    name: macOS app
    needs: release-plz-release
    if: ${{ needs.release-plz-release.outputs.releases_created == 'true' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: taiki-e/install-action@just
      - name: Build and attach DDPM.app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASES: ${{ needs.release-plz-release.outputs.releases }}
        run: |
          set -euo pipefail
          TAG=$(echo "$RELEASES" | jq -r '.[0].tag')
          VERSION=${TAG#v}
          git checkout "$TAG"
          just macos-app
          ZIP="ddpm-${VERSION}-universal-apple-darwin.zip"
          ditto -c -k --keepParent target/macos/DDPM.app "$ZIP"
          shasum -a 256 "$ZIP" > "$ZIP.sha256"
          gh release upload "$TAG" "$ZIP" "$ZIP.sha256"
