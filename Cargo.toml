[package]
name = "ddpm"
version = "0.1.0"
edition = "2024"
description = "Control brightness, contrast and input source of DDC/CI monitors"
repository = "https://github.com/chmelevskij/ddpm"

[dependencies]
eframe = "0.31"
ddc-hi = "0.4"
env_logger = "0.11"
log = "0.4"

[profile.release]
strip = true
lto = "thin"
