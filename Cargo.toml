[package]
name = "ddpm"
version = "0.2.0"
edition = "2024"
description = "Control brightness, contrast and input source of DDC/CI monitors"
repository = "https://github.com/chmelevskij/ddpm"
license = "MIT"

[dependencies]
eframe = { version = "0.31", features = ["persistence"] }
ddc-hi = "0.4"
env_logger = "0.11"
log = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.6", default-features = false, features = ["async-io", "blocking"] }

[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = { version = "0.26", default-features = false }

[profile.release]
strip = true
lto = "thin"
